name: Update FWC data and deploy Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "17 14 * * *"
  push:
    branches: ["main"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gcn-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: florida-manatee-mortality/requirements.txt

      - name: Install updater
        run: python -m pip install -r florida-manatee-mortality/requirements.txt

      - name: Retrieve and validate official FWC data
        run: |
          python florida-manatee-mortality/scripts/update_data.py
          python florida-manatee-mortality/scripts/validate_data.py

      - name: Save updated data
        run: |
          if git diff --quiet -- florida-manatee-mortality/data/mortality.json; then
            echo "No data change to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add florida-manatee-mortality/data/mortality.json
            git commit -m "data: refresh official FWC mortality records"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
